name: loadout-queue

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loadout_queue}
      POSTGRES_USER: ${POSTGRES_USER:-loadout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loadout-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-loadout_queue};Username=${POSTGRES_USER:-loadout};Password=${POSTGRES_PASSWORD:-loadout-local};GSS Encryption Mode=Disable
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-production-2026}
      PasswordRecovery__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5173}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromAddress: ${RESEND_FROM_ADDRESS:-no-reply@sur-tec.com.ar}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
